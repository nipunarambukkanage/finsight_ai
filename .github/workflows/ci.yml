name: FinSight AI - CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  assessment-validation:
    name: Assessment Contracts & Notebook Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Assessment Dependencies
        run: python -m pip install -r requirements-assessment.txt

      - name: Compile Assessment Packages
        run: python -m compileall -q task1_financial task2_genai task3_agentic

      - name: Run Deterministic Assessment Contracts
        run: pytest -q tests/backend/test_assessment_contracts.py

      - name: Validate Notebook JSON
        run: python -c "import json,pathlib; [json.loads(p.read_text()) for root in ('task1_financial','task2_genai','task3_agentic') for p in pathlib.Path(root).rglob('*.ipynb')]"

  backend-validation:
    name: Backend Lint & Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Ruff Code Quality Lint
        run: |
          ruff check backend/ tests/

      - name: Run Pytest Test Suite with Coverage
        run: |
          pytest --cov=backend/app --cov-report=term-missing tests/backend/

  frontend-validation:
    name: Frontend Lint, Test & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Vitest Unit Tests
        run: |
          cd frontend
          npm test

      - name: Verify Production Vite Bundle Build
        run: |
          cd frontend
          npm run build

  docker-validation:
    name: Docker Compose Syntax & Configuration Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config
